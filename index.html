<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> <meta name="theme-color" content="#000000"> <title>���������������� ����</title> <style> /* ===================================================== 1. �������� ��������� ===================================================== */ :root { --background: #000000; --date-size: 3rem; --clock-size: 8rem; --seconds-size: 0.64em; --date-gap: 18px; --battery-gap: 24px; --main-color: rgb(100, 0, 0); /* ================================================ ��������� ������ OLED ================================================ */ /* ������������ �������� �� ����������� */ --move-x: 24px; /* ������������ �������� �� ��������� */ --move-y: 20px; /* ����������������� ������ ������� ������� */ --move-time: 30s; } /* ===================================================== 2. ������� ����� ===================================================== */ * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: var(--background); overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; } body { display: flex; justify-content: center; align-items: center; font-family: "Courier New", Courier, monospace; } /* ===================================================== 3. ��������� ����� ===================================================== */ #interactive-zone { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 100%; margin-top: -20px; text-align: center; outline: none; will-change: transform; } /* ===================================================== 4. ���� ===================================================== */ .date-row { color: var(--main-color); font-size: var(--date-size); font-weight: bold; letter-spacing: -1px; white-space: nowrap; margin-bottom: var(--date-gap); text-shadow: 0 0 12px var(--main-color), 0 0 25px var(--main-color); transition: color 1s linear, text-shadow 1s linear; } /* ===================================================== 5. �������� ���� ===================================================== */ .clock { display: flex; justify-content: center; align-items: baseline; white-space: nowrap; color: var(--main-color); font-size: var(--clock-size); font-weight: 800; letter-spacing: 0.7px; line-height: 1; text-shadow: 0 0 18px var(--main-color), 0 0 38px var(--main-color); transition: color 1s linear, text-shadow 1s linear; } .time-main { display: inline-block; white-space: nowrap; } .seconds { display: inline-block; font-size: var(--seconds-size); font-weight: 600; letter-spacing: 0; line-height: 1; margin-left: 0.08em; color: inherit; text-shadow: inherit; } .seconds[hidden] { display: none; } /* ===================================================== 6. ��������� ������������ ===================================================== */ .battery-info { margin-top: var(--battery-gap); font-family: Arial, sans-serif; font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; color: var(--main-color); text-shadow: 0 0 12px var(--main-color), 0 0 25px var(--main-color); transition: color 1s linear, text-shadow 1s linear; } /* ===================================================== 7. ����� ��������� ������������ ===================================================== */ .battery-status { display: flex; justify-content: center; align-items: center; gap: 120px; margin-top: 24px; } .battery-dot { width: 16px; height: 16px; flex: 0 0 18px; border-radius: 50%; background: var(--main-color); transform: translateY(-14mm); box-shadow: 0 0 12px var(--main-color), 0 0 25px var(--main-color); opacity: 0; transition: opacity 0.3s linear, background 1s linear, box-shadow 1s linear; } .battery-dot.active { opacity: 1; } /* ===================================================== 8. ��������� ����� ===================================================== */ @media (max-width: 700px) { :root { --date-size: 1.25rem; --clock-size: 4.2rem; --seconds-size: 0.46em; --date-gap: 20px; --battery-gap: 24px; } .date-row { letter-spacing: 0; } .battery-info { font-size: 1.8rem; } } @media (max-width: 360px) { :root { --date-size: 1rem; --clock-size: 3.3rem; --date-gap: 18px; --battery-gap: 22px; } } @media (orientation: landscape) { .battery-info { font-size: 1.8rem; } } @media (orientation: portrait) { .date-row { font-size: 1.5rem; } } /* ===================================================== 9. ����� �������� ��������� �� ��������� ����� prefers-reduced-motion, ����� ������ OLED ��������. ===================================================== */ </style> </head> <body> <!-- ===================================================== 10. �������� ��������� ===================================================== --> <div id="interactive-zone"> <div id="date" class="date-row"> FR : 00.00.0000 </div> <div id="clock" class="clock"> <span id="time-main" class="time-main"> 00:00 </span> <span id="seconds" class="seconds" hidden> 00 </span> </div> <div id="battery" class="battery-info"> BATTERY: -- </div> <div class="battery-status"> <div id="battery-discharging" class="battery-dot active" aria-label="����������� �����������"> </div> <div id="battery-charging" class="battery-dot" aria-label="����������� ����������"> </div> </div> </div> <script> "use strict"; /* ===================================================== 11. �������� �������� ===================================================== */ const dateElement = document.getElementById("date"); const clockElement = document.getElementById("clock"); const timeMainElement = document.getElementById("time-main"); const secondsElement = document.getElementById("seconds"); const batteryElement = document.getElementById("battery"); const interactiveZone = document.getElementById("interactive-zone"); const dischargingDot = document.getElementById("battery-discharging"); const chargingDot = document.getElementById("battery-charging"); /* ===================================================== 12. ��� ������ ===================================================== */ const daysOfWeek = [ "7-Sun", "1-Mo", "2-Tue", "3-Wed", "4-Thu", "5-Fri", "6-Sat" ]; /* ===================================================== 13. ������� ===================================================== */ let secondsVisible = false; function toggleSeconds() { secondsVisible = !secondsVisible; secondsElement.hidden = !secondsVisible; updateClock(); } /* ===================================================== 14. ���� � ����� ===================================================== */ function updateClock() { const now = new Date(); const hours = String(now.getHours()).padStart(2, "0"); const minutes = String(now.getMinutes()).padStart(2, "0"); const seconds = String(now.getSeconds()).padStart(2, "0"); timeMainElement.textContent = `${hours}:${minutes}`; secondsElement.textContent = seconds; const dayName = daysOfWeek[now.getDay()]; const day = String(now.getDate()).padStart(2, "0"); const month = String(now.getMonth() + 1).padStart(2, "0"); const year = now.getFullYear(); dateElement.textContent = `${dayName} : ${day}.${month}.${year}`; } /* ===================================================== 15. �������� ����� ������������ ===================================================== */ const colorStops = [ { level: 0.00, r: 100, g: 0, b: 0 }, { level: 0.05, r: 255, g: 0, b: 0 }, { level: 0.17, r: 255, g: 100, b: 0 }, { level: 0.30, r: 255, g: 230, b: 0 }, { level: 0.42, r: 0, g: 255, b: 0 }, { level: 0.60, r: 0, g: 255, b: 190 }, { level: 0.72, r: 0, g: 100, b: 255 }, { level: 0.85, r: 100, g: 0, b: 255 }, { level: 1.00, r: 190, g: 0, b: 255 } ]; /* ===================================================== 16. ������������ ����� ===================================================== */ function interpolateColor(level) { level = Math.max(0, Math.min(1, level)); let left = colorStops[0]; let right = colorStops[colorStops.length - 1]; for (let i = 0; i < colorStops.length - 1; i++) { if ( level >= colorStops[i].level && level <= colorStops[i + 1].level ) { left = colorStops[i]; right = colorStops[i + 1]; break; } } const range = right.level - left.level; const progress = range === 0 ? 0 : (level - left.level) / range; const r = Math.round( left.r + (right.r - left.r) * progress ); const g = Math.round( left.g + (right.g - left.g) * progress ); const b = Math.round( left.b + (right.b - left.b) * progress ); return { r, g, b, css: `rgb(${r}, ${g}, ${b})` }; } /* ===================================================== 17. ���������� ����� ===================================================== */ function updateClockColor(level) { const percent = Math.round(level * 100); const color = interpolateColor(level); const glowStrong = `0 0 18px rgba(${color.r}, ${color.g}, ${color.b}, 0.85)`; const glowSoft = `0 0 38px rgba(${color.r}, ${color.g}, ${color.b}, 0.4)`; document.documentElement.style.setProperty( "--main-color", color.css ); clockElement.style.color = color.css; clockElement.style.textShadow = `${glowStrong}, ${glowSoft}`; secondsElement.style.color = color.css; secondsElement.style.textShadow = `${glowStrong}, ${glowSoft}`; dateElement.style.color = color.css; dateElement.style.textShadow = `${glowStrong}, ${glowSoft}`; batteryElement.style.color = color.css; batteryElement.style.textShadow = `${glowStrong}, ${glowSoft}`; dischargingDot.style.background = color.css; dischargingDot.style.boxShadow = `${glowStrong}, ${glowSoft}`; chargingDot.style.background = color.css; chargingDot.style.boxShadow = `${glowStrong}, ${glowSoft}`; batteryElement.textContent = `${percent}%`; } /* ===================================================== 18. ��������� ������� ===================================================== */ function updateBatteryStatus(battery) { const isCharging = battery.charging; dischargingDot.classList.toggle("active", !isCharging); chargingDot.classList.toggle("active", isCharging); } /* ===================================================== 19. ��������� ������ ������������ ===================================================== */ let currentBatteryLevel = 1; async function initBattery() { if (!("getBattery" in navigator)) { batteryElement.textContent = "�������: ��� ������"; currentBatteryLevel = 0.5; updateClockColor(currentBatteryLevel); dischargingDot.classList.remove("active"); chargingDot.classList.remove("active"); return; } try { const battery = await navigator.getBattery(); currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); updateBatteryStatus(battery); battery.addEventListener("levelchange", () => { currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); }); battery.addEventListener("chargingchange", () => { currentBatteryLevel = battery.level; updateClockColor(currentBatteryLevel); updateBatteryStatus(battery); }); } catch (error) { console.log( "�� ������� �������� ������� �������.", error ); batteryElement.textContent = "�������: ��� ������"; currentBatteryLevel = 0.5; updateClockColor(currentBatteryLevel); dischargingDot.classList.remove("active"); chargingDot.classList.remove("active"); } } /* ===================================================== 20. ������ OLED � ����������� �������� �������� ===================================================== */ /* ������������ ��������������� ����������. X = ��������� X * sin(����) Y = ��������� Y * cos(����) ��� ��������� ������������ ��������� �� ������ �����, � �� ��������� ������ ����� ������� ���������. */ let animationFrameId = null; let animationStartTime = null; function startScreenProtection() { if (animationFrameId !== null) { cancelAnimationFrame(animationFrameId); animationFrameId = null; } animationStartTime = null; const rootStyles = getComputedStyle( document.documentElement ); const amplitudeX = parseFloat( rootStyles.getPropertyValue("--move-x") ) || 0; const amplitudeY = parseFloat( rootStyles.getPropertyValue("--move-y") ) || 0; const durationText = rootStyles .getPropertyValue("--move-time") .trim(); let durationMs = 30000; if (durationText.endsWith("ms")) { durationMs = parseFloat(durationText); } else if (durationText.endsWith("s")) { durationMs = parseFloat(durationText) * 1000; } if (!Number.isFinite(durationMs) || durationMs <= 0) { durationMs = 30000; } function animate(timestamp) { if (animationStartTime === null) { animationStartTime = timestamp; } const elapsed = timestamp - animationStartTime; const progress = (elapsed % durationMs) / durationMs; const angle = progress * Math.PI * 2; const x = amplitudeX * Math.sin(angle); const y = -amplitudeY * Math.cos(angle); interactiveZone.style.transform = `translate3d(${x}px, ${y}px, 0)`; animationFrameId = requestAnimationFrame(animate); } animationFrameId = requestAnimationFrame(animate); } /* ������ ����� ���������� ���������� */ startScreenProtection(); /* ===================================================== 21. ���������� ����� � WAKE LOCK ===================================================== */ let wakeLock = null; let wakeLockRequested = false; async function enableWakeLock() { if (!("wakeLock" in navigator)) { return; } if (wakeLockRequested && wakeLock !== null) { return; } try { wakeLockRequested = true; wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; wakeLockRequested = false; }); } catch (error) { wakeLock = null; wakeLockRequested = false; console.log("Wake Lock ����������:", error); } } /* ������������� ������ ��� ����������� �� �������� */ document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { enableWakeLock(); if (animationFrameId === null) { startScreenProtection(); } } }); /* ===================================================== 22. ������������� ����� ===================================================== */ async function toggleFullscreen() { try { if (!document.fullscreenElement) { await document.documentElement.requestFullscreen(); } else { await document.exitFullscreen(); } } catch (error) { console.log( "�� ������� �������� ������������� �����:", error ); } } /* ===================================================== 23. ������� � ������� ������� ===================================================== */ let tapCount = 0; let tapTimer = null; const tapDelay = 350; function handleTap(event) { if ( event.pointerType === "mouse" && event.button !== 0 ) { return; } tapCount++; clearTimeout(tapTimer); tapTimer = setTimeout(async () => { const count = tapCount; tapCount = 0; if (count === 3) { toggleSeconds(); } else if (count === 2) { await toggleFullscreen(); } }, tapDelay); } document.addEventListener("pointerup", handleTap); /* ===================================================== 24. ������ ����� ===================================================== */ updateClock(); setInterval(updateClock, 200); initBattery(); enableWakeLock(); </script> </body> </html>
